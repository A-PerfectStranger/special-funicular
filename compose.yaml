services:
  db:
    image: postgres:16.11-bookworm@sha256:a2420e9555e2224583fe84d0bb3f0b967e69354ae3a0be55a9c14e251388c4eb
    environment:
      POSTGRES_PASSWORD: synthetic-bootstrap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retiro_synthetic"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
