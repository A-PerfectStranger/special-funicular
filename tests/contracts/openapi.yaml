  /v1/guard/operations/{operation_id}:
    get:
      operationId: pickupOperation
      security: *id003
      description: Only the original guard and site. Serializes timeout, timely receipt, revocation and
        30 s expiry. Late archive never reenables. No-store; technical readiness never grants permission.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperation'
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: *id004
  /v1/guard/operations/{operation_id}/report-handover:
    post:
      operationId: reportHandover
      security: *id003
      description: Original guard reports an observed fact, not a request for permission. One immutable
        report per episode; same key/body replays, another report conflicts. Late/outside-permission report
        keeps incidence. Physical fact survives archive failure; E4 owns notification dispatch.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
