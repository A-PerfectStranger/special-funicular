              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: *id004
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverReport'
  /v1/pickup/capabilities:
    get:
      operationId: syntheticPickupCapabilities
      responses:
        '200':
          description: Route exists only with E3 flag; does not authorize handover.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - pickup_enabled
                - synthetic_only
                properties:
                  pickup_enabled:
                    const: true
                  synthetic_only:
                    const: true
  /v1/operations/capabilities:
    get:
      operationId: operationsCapabilities
      responses:
        '200':
          description: E4 discovery; no identity data or handover permission
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [operations_enabled]
                properties:
                  operations_enabled: {const: true}
  /v1/me/notification-device:
    post:
      operationId: registerOwnNotificationDevice
      description: Available with E2 for parent mobile sessions, including device enrollment before E4 notification commissioning. Derives account on server; does not accept recipients. Expo receipts are pulled over HTTPS; no public provider callback exists.
      security: [{MobileBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, enabled]
              properties:
                token: {type: string, maxLength: 255, pattern: '^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]{10,200}\]$'}
                enabled: {type: boolean}
      responses:
        '200':
          description: Device preference stored; not a promise of reception
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [registered]
                properties:
                  registered: {type: boolean}
        '400': {description: Invalid input}
        '401': {description: Missing or revoked session}
        '403': {description: Wrong role or channel}
        '429': {description: Actor device-registration rate limit}
        '503': {description: Dependency unavailable}
  /v1/school/pickup-records:
    get:
      operationId: schoolPickupRecords
      description: School derived from online web session, isolated reader and audited query. No writes or bulk export. Dates refer to the site local date; preserves original report and linked corrections.
      security: [{DjangoSession: []}]
      parameters:
        - {$ref: '#/components/parameters/RecordLimit'}
        - {$ref: '#/components/parameters/RecordCursor'}
        - {$ref: '#/components/parameters/RecordStudent'}
        - {$ref: '#/components/parameters/RecordFrom'}
        - {$ref: '#/components/parameters/RecordTo'}
      responses:
        '200':
          description: School-scoped page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordPage'}
        '400': {description: Invalid filters or pagination}
        '401': {description: Missing or revoked session}
        '403': {description: Wrong role or channel}
        '503': {description: Dependency unavailable}
  /v1/me/pickups:
    get:
      operationId: ownPickupRecords
      description: Active linked parents including secondary; no caregiver document, photo, QR or other parents. Notification states concern only this parent. Corrections are additional interpretations, never handover permissions.
      security: [{MobileBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/RecordLimit'}
        - {$ref: '#/components/parameters/RecordCursor'}
        - {$ref: '#/components/parameters/RecordStudent'}
        - {$ref: '#/components/parameters/RecordFrom'}
        - {$ref: '#/components/parameters/RecordTo'}
      responses:
        '200':
          description: Family-scoped page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordPage'}
        '400': {description: Invalid filters or pagination}
        '401': {description: Missing or revoked session}
        '403': {description: Wrong role or channel}
        '503': {description: Dependency unavailable}
components:
  parameters:
    RecordLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    RecordCursor:
      name: before
      in: query
      schema: {type: integer, minimum: 1}
    RecordStudent:
      name: student
      in: query
      schema: {type: string, format: uuid}
    RecordFrom:
      name: from
      in: query
      schema: {type: string, format: date}
    RecordTo:
      name: to
      in: query
      schema: {type: string, format: date}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - access_denied
          - unavailable
          - invalid_request
    MobileStart:
      type: object
      additionalProperties: false
      required:
      - code_challenge
      properties:
        code_challenge: *id001
        purpose:
          enum:
          - login
          - reauth
          - activate
    LoginStart:
      type: object
      additionalProperties: false
      required:
      - authorization_url
      - state
      - exchange_key
      properties:
        authorization_url:
          type: string
          format: uri
        state: *id001
        exchange_key: *id001
    CodeExchange:
      type: object
      additionalProperties: false
      required:
      - state
      - exchange_key
      - code
      - code_verifier
      properties:
        state: *id001
        exchange_key: *id001
        code:
          type: string
          minLength: 1
          maxLength: 4096
        code_verifier:
          type: string
          pattern: ^[A-Za-z0-9._~-]{43,128}$
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - expires_in
      properties:
        access_token: *id001
        refresh_token: *id001
        expires_in: &id005
          const: 300
    MobileLogin:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - expires_in
      - role
      properties:
        access_token: *id001
        refresh_token: *id001
        expires_in: *id005
        role:
          enum:
          - PADRE
          - GUARDIA
    Reauthenticated:
      type: object
      additionalProperties: false
      required:
      - reauthenticated
      properties:
        reauthenticated:
          const: true
    Me:
      type: object
      additionalProperties: false
      required:
      - role
      - school_id
      - site_id
      - pickup_enabled
      properties:
        role:
          type: string
          enum:
          - PADRE
          - GUARDIA
          - ADMIN_ESCUELA
          - ADMIN_SISTEMA
        school_id:
          type:
          - string
          - 'null'
          format: uuid
        site_id:
          type:
          - string
          - 'null'
          format: uuid
        pickup_enabled:
          const: false
    AccessRecord:
      type: object
      additionalProperties: false
      required:
      - sequence
      - event_id
      - actor_id
      - school_id
      - occurred_at
      - result
      properties:
        sequence:
          type: integer
          minimum: 1
        event_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        result:
          enum:
          - OPENED
          - DENIED
          - PENDING_PROTECTION
    AccessPage:
      type: object
      additionalProperties: false
      required:
      - records
      - next_cursor
      properties:
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AccessRecord'
        next_cursor:
          type:
          - integer
          - 'null'
          minimum: 1
    Window:
      type: object
      additionalProperties: false
      required:
      - weekday
      - from
      - until
      - start_date
      - end_date
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        from:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        until:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Recurrence:
      type: object
      additionalProperties: false
      required:
      - start_date
      - end_date
      - weekdays
      - from
      - until
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        until:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    Student:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - site_id
      - timezone
      - principal
      - link_version
      - can_authorize
      - windows
      - blocked
      properties:
        id: *id002
        name: &id006
          type: string
          minLength: 1
          maxLength: 160
        site_id: *id002
        timezone:
          type: string
        principal:
          type: boolean
        link_version:
          type: integer
          minimum: 1
        can_authorize:
          type: boolean
        windows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
        blocked:
          type: boolean
    Students:
      type: object
      additionalProperties: false
      required:
      - students
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
    Caregiver:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - document
      - version
      properties:
        id: *id002
        name: *id006
        document:
          type: string
          minLength: 1
          maxLength: 40
        version:
          type: integer
          minimum: 1
    CaregiverCreate:
      type: object
      additionalProperties: false
      required:
      - student_id
      - name
      - document
      - photo
      properties:
        student_id: *id002
        name: *id006
        document: &id007
          type: string
          minLength: 1
          maxLength: 40
        photo: &id008
          type: string
          contentEncoding: base64
          maxLength: 400000
          description: JPEG/PNG up to 300000 decoded bytes and 4 million pixels. Server reencodes RGB
            JPEG, strips metadata and limits dimensions to 640px.
    CaregiverUpdate:
      type: object
      additionalProperties: false
      required:
      - student_id
      - name
      - document
      - photo
      - version
      properties:
        student_id: *id002
        name: *id006
        document: *id007
        photo: *id008
        version:
          type: integer
          minimum: 1
    AuthorizationCreate:
      type: object
      additionalProperties: false
      required:
      - student_id
      - caregiver_id
      - recurrence
      properties:
        student_id: *id002
        caregiver_id: *id002
        recurrence:
          $ref: '#/components/schemas/Recurrence'
    Authorization:
      type: object
      additionalProperties: false
      required:
      - id
      - caregiver_id
      - schedule
      - version
      - revoked
      properties:
        id: *id002
        caregiver_id: *id002
        schedule:
          type: array
          minItems: 1
          maxItems: 366
          items:
            type: object
            additionalProperties: false
            required:
            - from
            - until
            properties:
              from:
                type: string
                format: date-time
              until:
                type: string
                format: date-time
        version:
          type: integer
          minimum: 1
        revoked:
          type: boolean
    Family:
      type: object
      additionalProperties: false
      required:
      - caregivers
      - authorizations
      properties:
        caregivers:
          type: array
          items:
            $ref: '#/components/schemas/Caregiver'
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/Authorization'
    Applied:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - event_sequence
      properties:
        id: *id002
        status:
          const: APPLIED
        event_sequence:
          type: integer
          minimum: 1
    Activation:
      type: object
      additionalProperties: false
      required:
      - state
      - exchange_key
      - code
      - code_verifier
      - invitation
      properties:
        state: &id009
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        exchange_key: *id009
        code:
          type: string
          minLength: 1
          maxLength: 4096
        code_verifier:
          type: string
          pattern: ^[A-Za-z0-9._~-]{43,128}$
        invitation: *id009
    Activated:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          const: activated
    RevokeAuthorization:
      type: object
      additionalProperties: false
      required:
      - student_id
      properties:
        student_id: *id002
    PickupToken:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    IssueQR:
      type: object
      additionalProperties: false
      required:
      - valid_from
      properties:
        valid_from: &id010
          type: string
          format: date-time
    RescheduleQR:
      type: object
      additionalProperties: false
      required:
      - valid_from
      - episode_id
      properties:
        valid_from: *id010
        episode_id: *id004
    IssuedQR:
      type: object
      additionalProperties: false
      required:
      - qr
      - episode_id
      - valid_from
      - expires_at
      - issued
      - event_sequence
      properties:
        qr:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9_-]{43}$
        episode_id: *id004
        valid_from: *id010
        expires_at: *id010
        issued: &id011
          type: boolean
        event_sequence:
          type: integer
          minimum: 1
    ResolvedQR:
      type: object
      additionalProperties: false
      required:
      - episode_id
      - student_name
      - caregiver
      - valid_from
      - expires_at
      - server_now
      properties:
        episode_id: *id004
        student_name:
          type: string
        caregiver:
          type: object
          additionalProperties: false
          required:
          - name
          - document
          properties:
            name:
              type: string
            document:
              type: string
        valid_from: *id010
        expires_at: *id010
        server_now:
          type: string
          format: date-time
    PickupChecks:
      type: object
      additionalProperties: false
      required:
      - token
      - checks
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        checks:
          type: object
          additionalProperties: false
          required:
          - student
          - caregiver
          - document
          properties:
            student: *id011
            caregiver: *id011
            document: *id011
    PickupOperation:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - state
      - server_now
      - protection_deadline
      - permission_expires_at
      - may_handover
      - incident_reason
      - report_result
      - report_protected
      - event_sequence
      properties:
        operation_id: *id004
        state:
          enum:
          - PENDIENTE_ARCHIVO
          - HABILITADA
          - INCIDENCIA
          - ENTREGA_REPORTADA
        server_now: *id010
        protection_deadline: *id010
        permission_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        may_handover: *id011
        incident_reason:
          type: string
        report_result:
          enum:
          - ''
          - DELIVERED
          - NOT_DELIVERED
        report_protected: *id011
        event_sequence:
          type: integer
          minimum: 1
    HandoverReport:
      type: object
      additionalProperties: false
      required:
      - delivered
      - witnessed_at
      - reason
      properties:
        delivered: *id011
        witnessed_at: *id010
        reason:
          type: string
          minLength: 1
          maxLength: 500
    HandoverResult:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - report_event_id
      - event_sequence
      properties:
        operation_id: *id004
        report_event_id: *id004
        event_sequence:
          type: integer
          minimum: 1
    PickupError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          enum:
          - CONFLICT
          - RATE_LIMITED
          - DENIED
          - CLOSED
          - RESCHEDULE_REQUIRED
          - INVALID_WINDOW
    RecordPage:
      type: object
      additionalProperties: false
      required: [records, next_cursor]
      properties:
        next_cursor: {type: [integer, 'null'], minimum: 1}
        records:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PickupRecord'}
    PickupRecord:
      type: object
      additionalProperties: false
      required: [sequence, operation_id, student_id, student_name, local_date, timezone, decision_at, state, incident_reason, report_result, report_at, report_protected, correction_count, corrections, notification_states]
      properties:
        sequence: {type: integer, minimum: 1}
        operation_id: {type: string, format: uuid}
        student_id: {type: string, format: uuid}
        student_name: {type: string}
        local_date: {type: string, format: date}
        timezone: {type: string}
        decision_at: {type: string, format: date-time}
        state: {enum: [PENDIENTE_ARCHIVO, HABILITADA, INCIDENCIA, ENTREGA_REPORTADA]}
        incident_reason: {type: string}
        report_result: {enum: ['', DELIVERED, NOT_DELIVERED]}
        report_at: {type: [string, 'null'], format: date-time}
        report_protected: {type: boolean}
        correction_count: {type: integer, minimum: 0}
        corrections:
          type: array
          maxItems: 25
          description: Most recent 25 interpretations in sequence order; original fact remains separate.
          items:
            type: object
            additionalProperties: false
            required: [event_id, related_event_id, occurred_at, outcome, protected]
            properties:
              event_id: {type: string, format: uuid}
              related_event_id: {type: string, format: uuid}
              occurred_at: {type: string, format: date-time}
              outcome: {enum: [DELIVERED, NOT_DELIVERED, UNRESOLVED]}
              protected: {type: boolean}
        notification_states:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [state, count]
            properties:
              state: {enum: [PENDING, PENDING_DEVICE, PENDING_REVIEW, PROVIDER_ACCEPTED, PROVIDER_RECEIPT, SUPPRESSED]}
              count: {type: integer, minimum: 1}
  securitySchemes:
    MobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque session secret
    DjangoSession:
