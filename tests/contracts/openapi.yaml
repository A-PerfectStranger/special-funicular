openapi: 3.1.0
info:
  title: Retiro seguro - identidad, familia, retiro y avisos sintéticos
  version: 0.5.0
  description: E1/E2 keep their compatible capabilities. E3 requires E3_PICKUP_ENABLED and is synthetic-only;
    /v1/pickup/capabilities discovers it. Production commissioning remains blocked. No response or receipt
    authorizes offline handover. E2 permits own device enrollment; E4 separately gates history/school queries and notification commissioning.
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive; does not authorize pickups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    const: ok
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database connection available; does not authorize pickups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    const: ready
        '503':
          description: Technical dependency unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    const: unavailable
  /v1/capabilities:
    get:
      operationId: capabilities
      responses:
        '200':
          description: Public capability flags; no identity or child data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - api_version
                - pickup_enabled
                properties:
                  api_version:
                    const: v1
                  pickup_enabled:
                    const: false
  /v1/auth/mobile/start:
    post:
      operationId: startMobileOidc
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStart'
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileStart'
      description: Authorization Code/PKCE S256 in system browser. Reauth requires current mobile Bearer
        session.
  /v1/auth/mobile/exchange:
    post:
      operationId: exchangeMobileCode
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MobileLogin'
                - $ref: '#/components/schemas/Reauthenticated'
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeExchange'
  /v1/auth/refresh:
    post:
      operationId: rotateMobileRefresh
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - refresh_token
              properties:
                refresh_token: &id001
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
  /v1/auth/logout:
    post:
      operationId: revokeMobileSession
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    const: revoked
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - refresh_token
              properties:
                refresh_token: *id001
  /v1/me:
    get:
      operationId: readCurrentIdentity
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      - DjangoSession: []
  /v1/system/school-access-records:
    get:
      operationId: readSchoolAccessRecords
      responses:
        '200':
          description: Successful command or query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPage'
        '401':
          description: Missing/invalid/revoked identity or failed login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only local ADMIN_SISTEMA; no child, caregiver or pickup data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - DjangoSession: []
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: before
        required: false
        schema:
          type: integer
          minimum: 1
      - in: query
        name: school
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      description: ADMIN_SISTEMA web session only. Date filters are inclusive UTC dates. Every read and
        its audit event commit together. Keyset pagination.
  /v1/activation/redeem:
    post:
      operationId: activatePreloadedParent
      description: Start mobile OIDC with purpose=activate, then redeem Code/PKCE and invitation here.
        Signed email_verified=true and matching preloaded contact required; MFA and issuer/sub checked
        by server. One use, 24h expiry. No child data/session returned; perform a new ordinary login.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activated'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activation'
  /v1/students:
    get:
      operationId: ownStudents
      description: Own active students only, capabilities derived per current link. Secondary may consult;
        cannot authorize. E2 flag required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Students'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: &id003
      - MobileBearer: []
  /v1/students/{student_id}/family:
    get:
      operationId: familyRecords
      description: Only linked PADRE. Current caregiver versions and authorization schedules/revocations.
        Does not grant pickup permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
  /v1/caregivers:
    post:
      operationId: createCaregiver
      description: Principal only, MFA no older than 5 min. Complete name/document/photo required; no
        caregiver account.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applied'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id002
        description: Actor/body-bound UUID. Preserve it and the exact body after a lost response.
  /v1/caregivers/{caregiver_id}/update:
    post:
      operationId: updateCaregiver
      description: Principal, recent MFA, optimistic version and student lock. All associated authorizations
        are revoked atomically.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applied'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverUpdate'
      parameters:
      - name: caregiver_id
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id002
        description: Actor/body-bound UUID. Preserve it and the exact body after a lost response.
  /v1/authorizations:
    post:
      operationId: createAuthorization
      description: Principal and recent MFA. Finite weekly recurrence (up to 366 days), same date for
        one-off; ISO weekdays. School IANA timezone, complete interval within approved windows, future
        only, no blocked student. Missing/ambiguous DST times rejected. Schedule is not a QR.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applied'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id002
        description: Actor/body-bound UUID. Preserve it and the exact body after a lost response.
  /v1/authorizations/{authorization_id}/revoke:
    post:
      operationId: revokeAuthorization
      description: Principal and recent MFA; atomically invalidates authorization version. A subsequent
        issuance/decision must reject it.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applied'
        '400':
          description: Invalid input or incompatible replay; no side effects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Denied without object enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAuthorization'
      parameters:
      - name: authorization_id
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id002
        description: Actor/body-bound UUID. Preserve it and the exact body after a lost response.
  /v1/caregivers/{caregiver_id}/photo:
    get:
      operationId: caregiverPhoto
      security:
      - MobileBearer: []
      parameters:
      - name: caregiver_id
        in: path
        required: true
        schema: *id002
      description: Authenticated linked parent only. Reencoded JPEG; no-store, no public URL.
      responses:
        '200':
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Denied
        '503':
          description: Unavailable
  /v1/family/capabilities:
    get:
      operationId: familyCapabilities
      description: Only registered when E2 is enabled. Availability never grants pickup permission.
      responses:
        '200':
          description: Family feature available
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - family_enabled
                - pickup_enabled
                properties:
                  family_enabled:
                    const: true
                  pickup_enabled:
                    const: false
        '404':
          description: E2 disabled
  /v1/authorizations/{authorization_id}/issue-qr:
    post:
      operationId: issuePickupQR
      security: *id003
      description: Principal with MFA <=5 min. 32 random bytes, SHA-256 only at rest. Max 24 h advance.
        Renewal preserves original expiry. Issuance replay returns issued=false, qr=null; explicitly renew
        with a new key after response loss.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedQR'
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: authorization_id
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueQR'
  /v1/authorizations/{authorization_id}/reschedule:
    post:
      operationId: reschedulePickupQR
      security: *id003
      description: Principal; explicitly replaces the source episode tokens, validates the new occurrence
        and preserves closed episode identity.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedQR'
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: authorization_id
        in: path
        required: true
        schema: *id004
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleQR'
  /v1/guard/resolve-qr:
    post:
      operationId: resolvePickupQR
      security: *id003
      description: Guard at the current site, before expiry and after valid_from. Does not consume. Token
        only in body, never URL. Token bucket capacity 10 and refill 30/min by guard/origin.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedQR'
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupToken'
  /v1/guard/caregiver-photo:
    post:
      operationId: pickupCaregiverPhoto
      security: *id003
      description: Guard; same online time/version/scope checks as QR resolution; authenticated JPEG no-store.
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '429':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PickupError'
                - $ref: '#/components/schemas/Error'
        '503':
          description: No handover permission. Do not log request bodies or provider errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupToken'
  /v1/guard/confirm-pickup:
    post:
      operationId: confirmPickup
      security: *id003
      description: 'Guard; all three booleans required. False yields durable rejection/incidence, never
        a permission. UUID key is also operation ID: save it before sending. Decision/outbox/consumption
        commit together. Recovery uses the same ID; actor/body mismatch is 409.'
      responses:
        '200':
          description: Online result; only a current HABILITADA response with may_handover=true permits
            a handover.
