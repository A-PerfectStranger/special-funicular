AWSTemplateFormatVersion: '2010-09-09'
Description: Retiro seguro total development credit guardrail - alerts only
Parameters:
  AlertEmail:
    Type: String
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
  BudgetStartEpoch:
    Type: Number
    Description: Approved project start in Unix seconds
  BudgetEndEpoch:
    Type: Number
    Description: Actual credit expiry in Unix seconds - must follow start
Resources:
  TotalBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: retiro-seguro-total-150-usd
        BudgetType: COST
        TimeUnit: CUSTOM
        TimePeriod:
          Start: !Ref BudgetStartEpoch
          End: !Ref BudgetEndEpoch
        BudgetLimit:
          Amount: 150
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
          IncludeTax: true
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 75, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 90, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
