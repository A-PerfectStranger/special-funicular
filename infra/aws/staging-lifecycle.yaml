AWSTemplateFormatVersion: '2010-09-09'
Description: Synthetic staging expiry and narrowly scoped lifecycle permissions
Resources:
  Expiry:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retiro-staging-expiry
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default
      Policies:
        - PolicyName: DeleteOnlySyntheticStaging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:DeleteExpressGatewayService
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/retiro-staging/retiro-api
      Tags: [{Key: Project, Value: retiro-seguro}, {Key: Environment, Value: staging}]
  LifecyclePermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SyntheticStagingLifecycle
      Roles: [retiro-staging-Deploy]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecs:CreateExpressGatewayService
            Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/retiro-staging/*
            Condition:
              StringEquals: {aws:RequestTag/Project: retiro-seguro}
          - Effect: Allow
            Action: [scheduler:CreateSchedule, scheduler:GetSchedule, scheduler:DeleteSchedule]
            Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/retiro-staging-expiry-*
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt Expiry.Arn
            Condition:
              StringEquals: {iam:PassedToService: scheduler.amazonaws.com}
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/retiro-staging-lifecycle/*
Outputs:
  ExpiryRoleArn:
    Value: !GetAtt Expiry.Arn
