name: AWS staging and production
on:
  workflow_run:
    workflows: [E0 CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: aws-staging-production
  cancel-in-progress: false
jobs:
  scope:
    permissions: {contents: read, actions: read}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Read the successful candidate's immutable scope artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh run download "$SOURCE_RUN" --name "release-scope-$SOURCE_SHA" --dir work
      - id: scope
        env: {SOURCE_SHA: '${{ github.event.workflow_run.head_sha }}'}
        run: python3 scripts/release_scope.py cd --head "$SOURCE_SHA"
  publish:
    needs: scope
    permissions: {contents: read, actions: read, id-token: write}
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.publish.outputs.git_sha }}
      digest: ${{ steps.publish.outputs.oci_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require commissioned staging
        run: python3 scripts/validate_deploy.py infra/environments/staging.json
      # ubuntu-24.04 includes Skopeo. Fail before federation if the runner drifts.
      - run: command -v skopeo && skopeo --version
      - name: Publish approved immutable digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 scripts/publish_staging.py --run-id "$CI_RUN_ID"
  prepare:
    permissions: {contents: read, id-token: write}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Open bounded active window for private RDS
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 -m scripts.prepare_staging_run --sha "$RELEASE_SHA"
  migrate:
    permissions: {contents: read, id-token: write}
    needs: [publish, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Run isolated migration task
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --role Migrate -- python3 -m scripts.deploy_staging --mode migrate --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
  staging:
    permissions: {contents: read, id-token: write}
    needs: [publish, migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      e1_enabled: ${{ steps.e1.outputs.enabled }}
      e2_enabled: ${{ steps.e1.outputs.family }}
      e3_enabled: ${{ steps.e1.outputs.pickup }}
      e4_enabled: ${{ steps.e1.outputs.operations }}
      origin: ${{ steps.deployment.outputs.origin }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Determine the reviewed E1 staging gate
        id: e1
        run: |
          python3 - <<'PYCODE'
          import json, os
          configuration = json.load(open('infra/environments/staging.json'))
          enabled = configuration.get('e1_enabled') is True
          family = configuration.get('e2_enabled') is True
          pickup = configuration.get('e3_enabled') is True
          operations = configuration.get('e4_enabled') is True
          if pickup and not family:
              raise SystemExit('BLOCKED: E3 requires E2')
          if operations and not pickup:
              raise SystemExit('BLOCKED: E4 requires E3')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('enabled=' + str(enabled).lower() + '\n')
              stream.write('family=' + str(family).lower() + '\n')
              stream.write('pickup=' + str(pickup).lower() + '\n')
              stream.write('operations=' + str(operations).lower() + '\n')
          PYCODE
      - name: Deploy, verify running digest and TLS probes
        id: deployment
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 -m scripts.deploy_staging --mode deploy --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-deployment-${{ needs.publish.outputs.sha }}
          path: work/staging-deployment.json
          if-no-files-found: warn
          retention-days: 7
  e1-acceptance:
    needs: [publish, staging]
    if: needs.staging.outputs.e1_enabled == 'true'
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/e1-checks.yml
    secrets:
      STAGING_GOOGLE_SERVICES_JSON: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
    with:
      enable_operations: ${{ needs.staging.outputs.e4_enabled == 'true' }}
      release_sha: ${{ needs.publish.outputs.sha }}
      release_digest: ${{ needs.publish.outputs.digest }}
      release_origin: ${{ needs.staging.outputs.origin }}
  e2-acceptance:
    needs: [publish, staging, e1-acceptance]
    if: needs.staging.outputs.e2_enabled == 'true' && needs.e1-acceptance.result == 'success'
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/e2-checks.yml
    with:
      enable_pickup: ${{ needs.staging.outputs.e3_enabled == 'true' }}
      release_sha: ${{ needs.publish.outputs.sha }}
      release_digest: ${{ needs.publish.outputs.digest }}
      release_origin: ${{ needs.staging.outputs.origin }}
  production-prepare:
    needs: [publish, staging, e1-acceptance, e2-acceptance]
    if: always() && needs.staging.result == 'success' && (needs.e1-acceptance.result == 'success' || (needs.e1-acceptance.result == 'skipped' && needs.staging.outputs.e1_enabled != 'true')) && (needs.e2-acceptance.result == 'success' || (needs.e2-acceptance.result == 'skipped' && needs.staging.outputs.e2_enabled != 'true'))
    runs-on: ubuntu-24.04
    permissions: {contents: read, id-token: write}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Require observed production configuration
        run: python3 scripts/validate_deploy.py infra/environments/production.json
      - name: Check live budget and arm the bounded private production window
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --environment production --role Deploy -- python3 -m scripts.deploy_production --mode prepare --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-preflight-${{ needs.publish.outputs.sha }}
          path: work/production-*.json
          if-no-files-found: warn
          retention-days: 7
  production-migrate:
    needs: [publish, production-prepare]
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Migrate production using its isolated SQL and AWS identities
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --environment production --role Migrate -- python3 -m scripts.deploy_production --mode migrate --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-migration-${{ needs.publish.outputs.sha }}
          path: work/production-*.json
          if-no-files-found: warn
          retention-days: 7
  production:
    needs: [publish, staging, e1-acceptance, e2-acceptance, production-migrate]
    if: always() && needs.production-migrate.result == 'success' && needs.publish.result == 'success' && needs.staging.result == 'success' && (needs.e1-acceptance.result == 'success' || (needs.e1-acceptance.result == 'skipped' && needs.staging.outputs.e1_enabled != 'true')) && (needs.e2-acceptance.result == 'success' || (needs.e2-acceptance.result == 'skipped' && needs.staging.outputs.e2_enabled != 'true'))
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Deploy the same approved digest and verify production TLS and health
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --environment production --role Deploy -- python3 -m scripts.deploy_production --mode deploy --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-deployment-${{ needs.publish.outputs.sha }}
          path: work/production-*.json
          if-no-files-found: warn
          retention-days: 7
