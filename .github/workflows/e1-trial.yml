name: E1 synthetic trial
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful E0 CI main push run for the current main SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aws-staging-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions: {contents: read, actions: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.publish.outputs.git_sha }}
      digest: ${{ steps.publish.outputs.oci_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Require the current main's successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run_id = os.environ['CI_RUN_ID']
          if not run_id.isdigit():
              raise SystemExit('BLOCKED: numeric CI run required')
          run = json.loads(subprocess.check_output(['gh','api','repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run_id]))
          if run['head_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('BLOCKED: current main CI required')
          PY
      - name: Publish approved immutable candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 scripts/publish_staging.py --run-id "$CI_RUN_ID"
  prepare:
    needs: publish
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - name: Open bounded private RDS window
        env: {RELEASE_SHA: '${{ needs.publish.outputs.sha }}'}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 -m scripts.prepare_staging_run --sha "$RELEASE_SHA"
  migrate:
    needs: [publish, prepare]
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - name: Apply forward-only migrations
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --role Migrate -- python3 -m scripts.deploy_staging --mode migrate --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
  trial:
    needs: [publish, migrate]
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - name: Run bounded E1 API and archive trial (acceptance remains pending)
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/aws_oidc.py --role Deploy -- python3 -m scripts.deploy_staging --mode deploy --e1-trial --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-trial-deployment-${{ needs.publish.outputs.sha }}
          path: work/staging-deployment.json
          if-no-files-found: warn
          retention-days: 7
  browser:
    needs: [publish, trial]
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .node-version}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --target work/e1-sdk --require-hashes -r infra/aws/e1-ops.txt
      - name: Real synthetic MFA, BFF and mobile protocol (no native-device claim)
        env: {PYTHONPATH: 'work/e1-sdk'}
        run: python3 scripts/aws_oidc.py --role E1Acceptance -- python3 -m scripts.run_e1_browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-browser-acceptance-${{ needs.publish.outputs.sha }}
          path: work/e1-browser-acceptance.json
          if-no-files-found: warn
          retention-days: 7
  cloud:
    needs: [publish, trial, browser]
    if: always() && needs.trial.result == 'success'
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - run: python3 -m pip install --target work/e1-sdk --require-hashes -r infra/aws/e1-ops.txt
      - name: Independent real WORM, KMS, signatures and external high-water
        env: {PYTHONPATH: 'apps/backend:work/e1-sdk'}
        run: python3 scripts/aws_oidc.py --role E1Verifier -- python3 -m scripts.verify_e1_staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-cloud-acceptance-${{ needs.publish.outputs.sha }}
          path: work/e1-cloud-acceptance.json
          if-no-files-found: warn
          retention-days: 7
  staging-apk:
    needs: [publish, trial]
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .node-version}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.13.5'}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
      - name: Set public staging endpoint
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('EXPO_PUBLIC_API_URL=' + json.load(open('infra/environments/staging.json'))['base_url'] + '\n')
          PY
      - name: Build configured internal staging APK with development signing
        env:
          GIT_SHA: ${{ needs.publish.outputs.sha }}
          APP_ENV: staging
          ANDROID_PACKAGE_ID: org.retiroseguro.staging
          MOBILE_OIDC_SCHEME: retiro-seguro-staging
          EXPO_PUBLIC_OIDC_REDIRECT_URI: retiro-seguro-staging://auth/callback
        run: bash scripts/build-apk.sh
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/artifacts/*.apk'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-apk-manifest-${{ needs.publish.outputs.sha }}
          path: work/artifacts/*.json
          if-no-files-found: error
          retention-days: 7
      # An internal APK is never uploaded as a public artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event.repository.private
        with:
          name: staging-apk-${{ needs.publish.outputs.sha }}
          path: work/artifacts/*.apk
          if-no-files-found: error
          retention-days: 3
  archive-drill:
    needs: [publish, trial, browser, cloud]
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {PYTHONPATH: 'apps/backend:work/e1-sdk'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.publish.outputs.sha }}', persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .node-version}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --target work/e1-sdk --require-hashes -r infra/aws/e1-ops.txt
      - name: Prove archive absence denies login and late evidence cannot reopen it
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 -m scripts.e1_archive_drill --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - name: Retry archive recovery if the coordinator was interrupted
        if: always()
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          state, report = Path('work/e1-archive-drill-control.json'), Path('work/e1-archive-recovery.json')
          recovered = report.exists() and json.loads(report.read_text()).get('archive_recovered') is True
          if state.exists() and not recovered:
              subprocess.run(['python3','scripts/aws_oidc.py','--role','Deploy','--','python3','-m','scripts.e1_archive_control','resume','--sha',os.environ['RELEASE_SHA'],'--digest',os.environ['RELEASE_DIGEST']],check=True)
          PY
      - name: Verify the late archived attempt with an independent identity
        run: |
          python3 - <<'PY'
          import json, subprocess
          report = json.load(open('work/e1-archive-drill.json'))
          sequence = report.get('denied_event_sequence')
          if report.get('passed') is not True or type(sequence) is not int or sequence < 1:
              raise SystemExit('BLOCKED: no proven denied archive attempt')
          subprocess.run(['python3','scripts/aws_oidc.py','--role','E1Verifier','--','python3','-m','scripts.verify_e1_staging','--minimum-sequence',str(sequence)],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-archive-drill-${{ needs.publish.outputs.sha }}
          path: |
            work/e1-archive-drill.json
            work/e1-archive-recovery.json
            work/e1-cloud-acceptance.json
          if-no-files-found: warn
          retention-days: 7
