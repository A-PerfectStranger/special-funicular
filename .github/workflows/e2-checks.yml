name: E2 integrated synthetic checks
on:
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      release_digest:
        required: true
        type: string
      enable_pickup:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  family:
    permissions: {contents: read, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ inputs.release_sha }}', persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .node-version}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --target work/e1-sdk --require-hashes -r infra/aws/e1-ops.txt
      - name: Real E2 activation, family permissions and private revocations
        env:
          PYTHONPATH: work/e1-sdk
          E2_RELEASE_SHA: ${{ inputs.release_sha }}
          E2_RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: python3 scripts/aws_oidc.py --role E1Acceptance -- python3 -m scripts.run_e2_browser
      - name: Real synthetic E3 door protocol with timely and late WORM
        if: inputs.enable_pickup
        env:
          PYTHONPATH: work/e1-sdk
          E2_RELEASE_SHA: ${{ inputs.release_sha }}
          E2_RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: python3 scripts/aws_oidc.py --role E1Acceptance -- python3 -m scripts.run_e3_browser
      - name: Verify every preceding E2/E3 event with the independent WORM reader
        env: {PYTHONPATH: 'apps/backend:work/e1-sdk'}
        run: |
          sequence=$(python3 -c 'import json,pathlib; paths=[pathlib.Path("work/e2-browser-acceptance.json"),pathlib.Path("work/e3-browser-acceptance.json")]; print(max(json.loads(p.read_text())["minimum_sequence"] for p in paths if p.exists()))')
          python3 scripts/aws_oidc.py --role E1Verifier -- python3 -m scripts.verify_e1_staging --minimum-sequence "$sequence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2-family-acceptance-${{ inputs.release_sha }}
          path: |
            work/e3-browser-acceptance.json
            work/e2-browser-acceptance.json
            work/e1-cloud-acceptance.json
          if-no-files-found: warn
          retention-days: 7
