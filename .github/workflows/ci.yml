name: E0 CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      test_e1_limits:
        description: Run the real 15-minute anonymous staging lockout probe (no AWS credentials)
        type: boolean
        default: false
      expected_release_sha:
        description: SHA from the approved active E1 deployment report
        type: string
        default: ''
      expected_image_digest:
        description: Digest from the approved active E1 deployment report
        type: string
        default: ''
  schedule:
    - cron: '23 11 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'regular' }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE_EVENT: ${{ github.event_name }}
        run: python3 scripts/release_scope.py ci --base "$SCOPE_BASE" --head "$SCOPE_HEAD" --event "$SCOPE_EVENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: work/release-scope.json
          retention-days: 7
          if-no-files-found: error
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: cp .env.example .env
      - run: make install db check
      - name: Regression for the real Chromium native-scheme callback boundary
        run: |
          npx playwright install --with-deps chromium
          node --test tests/staging/native-callback.test.mjs tests/staging/recovery.test.mjs
      - run: npm run mobile:export
      - name: Audit locked Python and npm dependencies
        run: |
          mkdir -p work
          uv export --frozen --no-hashes --no-emit-project -o work/requirements-audit.txt >/dev/null
          uv run pip-audit --no-deps --disable-pip -r work/requirements-audit.txt
          npm audit --audit-level=low
      - name: Install verified gitleaks and scan history and working tree
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          bash scripts/install_gitleaks.sh
          work/gitleaks git --redact --config .gitleaks.toml
          work/gitleaks dir --redact --config .gitleaks.toml
      - run: docker compose down
        if: always()
  backend-image:
    needs: [scope, quality]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable OCI artifact
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p work/artifacts
          docker buildx build --build-arg GIT_SHA="$GIT_SHA" --tag "retiro-backend:$GIT_SHA" --output type=docker,dest=work/backend-docker.tar --output type=oci,dest=work/artifacts/backend.oci.tar --metadata-file work/image-metadata.json .
          DIGEST=$(python3 -c 'import json; print(json.load(open("work/image-metadata.json"))["containerimage.digest"])')
          uv run python scripts/artifact_manifest.py work/artifacts/backend.oci.tar --kind backend-oci --sha "$GIT_SHA" --digest "$DIGEST"
      - name: Smoke image with PostgreSQL, non-root and read-only filesystem
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          cp .env.example .env
          docker load -i work/backend-docker.tar
          make db
          bash scripts/smoke_image.sh "retiro-backend:$GIT_SHA"
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          path: work/artifacts/
          retention-days: 7
          if-no-files-found: error
  development-apk:
    needs: [scope, quality]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Prepare the exact pinned Gradle from its official release API
        id: gradle
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/gradle_archive.py download
      - name: Compile standalone arm64 development APK with SDK 56 and debug signing
        env:
          GIT_SHA: ${{ github.sha }}
          RETIRO_GRADLE_ARCHIVE: ${{ steps.gradle.outputs.archive }}
        run: bash scripts/build-apk.sh
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/artifacts/*.apk'
      # This repository is public: never publish internal APKs as public artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-apk-manifest-${{ github.sha }}
          path: work/artifacts/*.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event.repository.private
        with:
          name: development-apk-${{ github.sha }}
          path: work/artifacts/*.apk
          retention-days: 3
          if-no-files-found: error
  required:
    if: always()
    needs: [scope, quality, backend-image, development-apk]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every E0 check and artifact build
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['scope']['result'] == results['quality']['result'] == 'success'
          expected = 'skipped' if os.environ['DOCS_ONLY'] == 'true' else 'success'
          assert results['backend-image']['result'] == results['development-apk']['result'] == expected
          PY

  public-limits:
    if: github.event_name == 'workflow_dispatch' && inputs.test_e1_limits == true
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.13.5'}
      - run: uv sync --frozen
      - name: Observe the actual threshold, isolation and 15-minute expiry
        env:
          RELEASE_SHA: ${{ inputs.expected_release_sha }}
          RELEASE_DIGEST: ${{ inputs.expected_image_digest }}
        run: uv run python -m scripts.probe_e1_limits --sha "$RELEASE_SHA" --digest "$RELEASE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e1-backend-limits-${{ inputs.expected_release_sha }}
          path: work/e1-backend-limit-acceptance.json
          if-no-files-found: warn
          retention-days: 7
