name: E0 CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: cp .env.example .env
      - run: make install db check
      - run: npm run mobile:export
      - name: Audit locked Python and npm dependencies
        run: |
          mkdir -p work
          uv export --frozen --no-hashes --no-emit-project -o work/requirements-audit.txt >/dev/null
          uv run pip-audit --no-deps --disable-pip -r work/requirements-audit.txt
          npm audit --audit-level=low
      - name: Install verified gitleaks and scan history and working tree
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o work/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o work/checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1 "  work/" $2}' work/checksums.txt | sha256sum -c -
          tar -xzf work/gitleaks_8.30.1_linux_x64.tar.gz -C work gitleaks
          work/gitleaks git --redact --config .gitleaks.toml
          work/gitleaks dir --redact --config .gitleaks.toml
      - run: docker compose down
        if: always()
  backend-image:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable OCI artifact
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p work/artifacts
          docker buildx build --build-arg GIT_SHA="$GIT_SHA" --tag "retiro-backend:$GIT_SHA" --output type=docker,dest=work/backend-docker.tar --output type=oci,dest=work/artifacts/backend.oci.tar --metadata-file work/image-metadata.json .
          DIGEST=$(python3 -c 'import json; print(json.load(open("work/image-metadata.json"))["containerimage.digest"])')
          uv run python scripts/artifact_manifest.py work/artifacts/backend.oci.tar --kind backend-oci --sha "$GIT_SHA" --digest "$DIGEST"
      - name: Smoke image with PostgreSQL, non-root and read-only filesystem
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          cp .env.example .env
          docker load -i work/backend-docker.tar
          make db
          bash scripts/smoke_image.sh "retiro-backend:$GIT_SHA"
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          path: work/artifacts/
          retention-days: 7
          if-no-files-found: error
  development-apk:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Compile standalone arm64 development APK with SDK 56 and debug signing
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/build-apk.sh
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/artifacts/*.apk'
      # This repository is public: never publish internal APKs as public artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-apk-manifest-${{ github.sha }}
          path: work/artifacts/*.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event.repository.private
        with:
          name: development-apk-${{ github.sha }}
          path: work/artifacts/*.apk
          retention-days: 3
          if-no-files-found: error
  required:
    if: always()
    needs: [quality, backend-image, development-apk]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every E0 check and artifact build
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PY
